services:
  db:
    image: postgres:17
    container_name: duck2p_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-duck}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-duckpass}
      POSTGRES_DB: ${DB_NAME:-duck2p_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - duck2p_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - duck2p_network

  backend:
    build: ./backend
    container_name: duck2p_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-duck}
      DB_PASSWORD: ${DB_PASSWORD:-duckpass}
      DB_NAME: ${DB_NAME:-duck2p_db}
    volumes:
      - ./backend/src:/app/src
    depends_on:
      - db
    networks:
      - duck2p_network

  frontend:
    build: ./frontend
    container_name: duck2p_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - duck2p_network

volumes:
  duck2p_pgdata: {}

networks:
  duck2p_network:
    driver: bridge
